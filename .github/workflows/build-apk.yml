name: build-catbox-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CATBOX_RUN_NUMBER: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_catboxRunNumber: ${{ github.run_number }}
    steps:
      # 源码在**私有**仓库 France113/catbox-flutter，通过 Secret 里的 PAT 拉取。
      # 本仓库(public)只承载构建流程，不含任何业务代码。
      - uses: actions/checkout@v4
        with:
          repository: France113/catbox-flutter
          token: ${{ secrets.PAT_PRIVATE }}
          persist-credentials: false

      # ---------- 工具链 ----------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 注意：单行空格分隔，不能用 YAML 多行块（整块会被当成一个包名）
          # ndk 装**两个**：
          #   28.2.13676358 —— app（fvp/libmdk 要求）
          #   27.0.12077973 —— fvp 插件自己声明的 ndkVersion
          #   （AGP 8.11 对 NDK 版本校验更严，缺了会报
          #    "Failed to install the following SDK components: ndk;27.0.12077973"）
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 ndk;27.0.12077973 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      # ⚠️ 必须**全量**接受 SDK license：
      #    setup-android 的 accept-android-sdk-licenses 只接受 `packages` 里显式列出
      #    那几个包的许可。而 AGP 8.11.1（Flutter 3.47.9 的硬性下限）在构建时会按需
      #    自动下载 android-googletv-license / google-gdk-license 等额外组件，
      #    这些 license 没接受 → Gradle 卡在交互式提示
      #    "7 of 8 SDK package licenses not accepted. Review licenses (y/N)?" → 构建失败。
      #    这一步把所有许可一次性接受，之后 AGP 自动下载组件就不会再卡。
      - name: Accept all Android SDK licenses
        run: |
          set +e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found, skip license acceptance"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1
          echo "licenses accepted (rc=$?)"
          tail -3 /tmp/sdk-licenses.log

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Versions
        run: |
          flutter --version
          node -v
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # ---------- 1) 打包 Node sidecar（fastify → 单文件） ----------
      - name: Build JS sidecar (esbuild)
        run: |
          set -uo pipefail
          cd js
          npm install --no-audit --no-fund
          npm run build
          ls -lh ../assets/js/index.js
          node --check ../assets/js/index.js

      # ---------- 2) libnode.so（nodejs-mobile v18.20.4，per ABI） ----------
      - name: Fetch libnode.so (per ABI)
        run: |
          # 刻意不开 -e：每步自己判错（pipefail + API 限流会静默退出，踩过）
          set -uo pipefail
          URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
          echo "download: $URL"
          ok=0
          for i in 1 2 3; do
            echo "attempt $i"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 900 \
                 -o /tmp/node-android.zip "$URL"; then
              ok=1; break
            fi
            echo "attempt $i failed, retrying in 5s"
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "::error::nodejs-mobile 下载失败（3 次）"; exit 1; fi

          ls -lh /tmp/node-android.zip
          rm -rf /tmp/nm && mkdir -p /tmp/nm
          unzip -q -o /tmp/node-android.zip -d /tmp/nm || { echo "::error::解压失败"; exit 1; }
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="/tmp/nm/bin/$ABI/libnode.so"
            DST="android/app/src/main/jniLibs/$ABI"
            if [ ! -f "$SRC" ]; then echo "::error::缺少 $SRC"; exit 1; fi
            mkdir -p "$DST"
            cp "$SRC" "$DST/libnode.so"
            echo "$ABI: $(stat -c%s "$DST/libnode.so") bytes"
          done

      # ---------- 2.5) libc++_shared.so（libnode.so 的运行时依赖，必须！） ----------
      # ⚠️ 这是 2026-11-12「一打开 App 就闪退、且没有任何提示」的**根因**：
      #
      #   libnode.so（nodejs-mobile v18.20.4 预编译）的 DT_NEEDED 里写着 libc++_shared.so
      #   （实测：libnode.so NEEDED = libm, libdl, liblog, libc++_shared, libc）
      #   而这个 .so 以前是 **fvp(libmdk) 顺带打进 APK 的**（老 APK 里确实有
      #   lib/arm64-v8a/libc++_shared.so，1.25MB）。
      #   2026-11-12 删掉 fvp（省 10MB）后，就没人提供它了 →
      #     System.loadLibrary("node") → dlopen failed: library "libc++_shared.so" not found
      #     → UnsatisfiedLinkError → 静态初始化里抛 → 进程当场死 → **无声闪退**。
      #
      #   修法：从 NDK 里把 libc++_shared.so 复制到 jniLibs/<abi>/（NDK r27+ 自带 16KB 对齐版本）。
      #   ⚠️ 不要用 `arguments "-DANDROID_STL=c++_shared"` —— AGP 8.11 的 CmakeOptions
      #      已经没有 arguments() 方法了，会报 "Could not find method arguments()"。
      - name: Copy libc++_shared.so (from NDK)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$PRE/sysroot"
          READELF="$PRE/bin/llvm-readelf"
          STRIP="$PRE/bin/llvm-strip"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf 不存在：$READELF"; exit 1; }
          # ⚠️ **不要猜 NDK 目录名**：不同 NDK 版本的 32 位 ARM triple 目录名不一样
          #    （armv7a-linux-androideabi / arm-linux-androideabi …），
          #    猜错就"找不到文件"（2026-11-12 run#143 就这么失败的）。
          #    正确做法：遍历 sysroot 下所有 libc++_shared.so，按 **ELF 机器类型**挑。
          #    按路径深度排序（浅的在前）= 官方那份"当前 API 版本"。
          mapfile -t CAND < <(find "$SYSROOT" -name 'libc++_shared.so' -printf '%d %p\n' 2>/dev/null | sort -n | cut -d' ' -f2-)
          echo "NDK 内 libc++_shared.so 候选 ${#CAND[@]} 个"
          for f in "${CAND[@]}"; do echo "   $f"; done
          pick() {
            local want="$1" f m
            for f in "${CAND[@]}"; do
              m=$("$READELF" -h "$f" 2>/dev/null | sed -n 's/^ *Machine: *//p' | head -1)
              case "$m" in *"$want"*) printf '%s' "$f"; return 0 ;; esac
            done
            return 1
          }
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a)   want="AArch64" ;;
              armeabi-v7a) want="ARM" ;;
              x86_64)      want="X86-64" ;;
            esac
            SRC=$(pick "$want" || true)
            if [ -z "$SRC" ]; then
              if [ "$ABI" = "arm64-v8a" ]; then
                echo "::error::NDK 里找不到 arm64-v8a 的 libc++_shared.so（缺它 → 装上就闪退）"
                exit 1
              fi
              echo "::warning::NDK 里没有 $ABI 的 libc++_shared.so —— 该 ABI 不出包，"
              echo "::warning::同时清掉它的 libnode.so（避免半套 native 依赖）"
              rm -f "android/app/src/main/jniLibs/$ABI/libnode.so"
              continue
            fi
            DST="android/app/src/main/jniLibs/$ABI"
            mkdir -p "$DST"
            cp "$SRC" "$DST/libc++_shared.so"
            # 官方那份是 9MB 带符号的，strip 后 ~1.3MB（老 APK 里的就是 1.25MB）
            "$STRIP" --strip-unneeded "$DST/libc++_shared.so"
            echo "$ABI: $(stat -c%s "$DST/libc++_shared.so") bytes  <- $SRC"
          done

      # ---------- 3) strip 瘦身 + 16KB 页重对齐（Android 15+） ----------
      - name: Strip + 16KB page-align libnode.so
        run: |
          set -uo pipefail
          STRIP=$(ls -d "$ANDROID_HOME"/ndk/28.2.13676358/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)
          if [ -z "$STRIP" ] || [ ! -x "$STRIP" ]; then echo "::error::llvm-strip not found"; exit 1; fi
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            F="android/app/src/main/jniLibs/$ABI/libnode.so"
            echo "== $ABI before strip: $(stat -c%s "$F") bytes"
            "$STRIP" --strip-unneeded "$F"
            echo "== $ABI after  strip: $(stat -c%s "$F") bytes"
          done
          # 4KB → 16KB 重布局（patchelf --page-size 做不到，自研脚本，自带校验+幂等）
          python3 scripts/align_elf_16k.py android/app/src/main/jniLibs/*/libnode.so || {
            echo "::error::16KB 重对齐失败"; exit 1; }
          python3 scripts/check_elf_16k.py android/app/src/main/jniLibs/*/libnode.so || {
            echo "::error::16KB 校验失败"; exit 1; }
          # libc++_shared.so：NDK 里 **x86_64 那份是 4KB 对齐**（arm64/v7a 是 16KB），
          #   所以统一用脚本重排一次（脚本幂等，已对齐的原样写出）。
          #   我们只出 arm64-v8a，但顺手把三个 ABI 都弄合规，以后要出别的架构也不用改。
          python3 scripts/align_elf_16k.py android/app/src/main/jniLibs/*/libc++_shared.so || {
            echo "::error::libc++_shared.so 16KB 重排失败"; exit 1; }
          python3 scripts/check_elf_16k.py android/app/src/main/jniLibs/*/libc++_shared.so || {
            echo "::error::libc++_shared.so 非 16KB 对齐 —— 16KB 页设备上会加载失败"; exit 1; }

      # ---------- 4) 用官方模板补齐 Android 宿主（gradlew / wrapper jar / 官方 settings） ----------
      - name: Assemble Android host
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.catbox --project-name catbox /tmp/host
          mkdir -p /tmp/keep
          # 我们的自定义文件
          cp -r android/app/src/main/kotlin /tmp/keep/kotlin
          cp -r android/app/src/main/cpp   /tmp/keep/cpp
          cp -r android/app/src/main/res   /tmp/keep/res
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/AndroidManifest.xml
          cp android/app/build.gradle       /tmp/keep/app-build.gradle
          cp android/app/proguard-rules.pro /tmp/keep/proguard-rules.pro
          # ⚠️ settings.gradle / 根 build.gradle 也必须是**我们的版本**：
          #    它们 include 了 OrangePlayer 的 7 个本地源码模块
          #    （:palyerlibrary / :gsyVideoPlayer-* / :orange-*）。
          #    早期这里只保留了 app/ 下的文件，rsync 用模板把 settings.gradle
          #    覆盖回默认内容 → Gradle 报
          #    "Project with path ':palyerlibrary' could not be found in project ':app'"
          cp android/settings.gradle /tmp/keep/settings.gradle
          cp android/build.gradle    /tmp/keep/build.gradle
          # 模板带来：gradle.properties + wrapper(jar/脚本)
          rsync -a /tmp/host/android/ android/
          # 只保留模板生成的那种 DSL，删掉仓库里的另一种，避免歧义
          if [ -f android/settings.gradle.kts ]; then rm -f android/settings.gradle; fi
          if [ -f android/build.gradle.kts ];   then rm -f android/build.gradle;   fi
          # 恢复自定义文件
          rm -rf android/app/src/main/kotlin android/app/src/main/cpp android/app/src/main/res
          cp -r /tmp/keep/kotlin android/app/src/main/kotlin
          cp -r /tmp/keep/cpp   android/app/src/main/cpp
          cp -r /tmp/keep/res   android/app/src/main/res
          cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/keep/app-build.gradle     android/app/build.gradle
          cp /tmp/keep/proguard-rules.pro   android/app/proguard-rules.pro
          # 恢复我们的 settings.gradle / 根 build.gradle（含 OrangePlayer 模块 include）
          cp /tmp/keep/settings.gradle      android/settings.gradle
          cp /tmp/keep/build.gradle         android/build.gradle
          # orange-player/ 源码目录不会被 rsync 删掉（rsync 没加 --delete），
          # 这里只做存在性断言，避免以后有人加 --delete 时静默丢失。
          test -d android/orange-player/palyerlibrary || {
            echo "::error::android/orange-player 缺失（播放器源码没被检出？）"; exit 1; }
          # app 目录只保留我们的 Groovy build.gradle，删掉模板的 .kts（否则 Gradle 报警告）
          rm -f android/app/build.gradle.kts
          echo "--- android/ ---"; ls android android/app
          echo "--- settings ---"; cat android/settings.gradle* 2>/dev/null
          # AGP 版本自检：Flutter SDK 对 AGP 有硬性下限（3.47.9 要求 >= 8.11.1）。
          # 把模板自带的版本和我们的版本并排打出来，出问题一眼定位。
          echo "--- AGP 版本对比 ---"
          echo -n "  模板:   "; grep -o 'com.android.application\" version \"[0-9.]*' /tmp/host/android/settings.gradle 2>/dev/null | head -1 || echo '(无)'
          echo -n "  我们的: "; grep -o 'com.android.application\" version \"[0-9.]*' android/settings.gradle 2>/dev/null | head -1 || echo '(无)'
          echo "--- wrapper ---"; ls android/gradle/wrapper/ android/gradlew

      # ---------- 5) 依赖解析 ----------
      - name: Flutter pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a /tmp/build.log || {
            echo "==================== PUB GET FAILED ====================" | tee -a /tmp/build.log
            flutter pub get -v 2>&1 | tail -120 | tee -a /tmp/build.log
            exit 1
          }
          echo "--- pubspec.lock 关键包 ---" | tee -a /tmp/build.log
          grep -B1 -A3 -E '^  (fvp|video_player|media3|http|shared_preferences|path_provider|file_picker):' pubspec.lock | tee -a /tmp/build.log || true

      # ---------- 6) 固定 keystore（⚠️ 必须固定，否则覆盖安装必失败） ----------
      # 背景：Android 覆盖安装要求**签名证书一致**。原来这里每次 keytool -genkeypair
      # 生成一次性的 keystore（/tmp 目录，CI 每次都是新机器）→ 每一版 APK 签名都不同
      # → 装第二版时系统报"应用未安装 / 签名不一致"（用户反馈的"安卓版安装失败"）。
      # 现在：仓库里带一份固定 keystore（ci/catbox.keystore.b64），每次都用它签。
      - name: Prepare keystore
        run: |
          set -euo pipefail
          KS_OK=0
          if [ -f ci/catbox.keystore.b64 ]; then
            base64 -d ci/catbox.keystore.b64 > /tmp/catbox.keystore
            # 固定 keystore 是标准 debug keystore（PKCS12，alias=androiddebugkey）
            if keytool -list -keystore /tmp/catbox.keystore -storepass android >/dev/null 2>&1; then
              KS_PASS=android
              KS_ALIAS=androiddebugkey
              KS_OK=1
              echo "固定 keystore 可用（alias=androiddebugkey）"
            else
              echo "::warning::ci/catbox.keystore.b64 存在但密码不对，回退一次性 keystore"
            fi
          fi
          if [ "$KS_OK" -ne 1 ]; then
            echo "::warning::没有可用的固定 keystore → 本次仍是一次性签名，下一版覆盖安装会失败"
            keytool -genkeypair -v -keystore /tmp/catbox.keystore -alias catbox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catbox123 -keypass catbox123 \
              -dname "CN=CatBox, OU=Mobile, O=CatBox, L=Shenzhen, S=Guangdong, C=CN" 2>&1 | tail -3
            KS_PASS=catbox123
            KS_ALIAS=catbox
          fi
          {
            echo "storeFile=/tmp/catbox.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_PASS"
          } > android/keystore.properties
          cat android/keystore.properties
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"

      # ---------- 7) 构建 ----------
      - name: Build APKs (split per ABI)
        run: |
          set +e
          # 只出 arm64-v8a（用户只用这个）：--target-platform android-arm64 后
          # --split-per-abi 只会产出 catbox-arm64-v8a.apk，构建时间减半。
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=CATBOX_VERSION=1.0.${{ github.run_number }} -v > /tmp/build.log 2>&1

          rc=$?
          echo "flutter build rc=$rc"
          if [ $rc -ne 0 ]; then
            echo "===== 关键错误 ====="
            grep -nE "error:|FAILURE|What went wrong|Caused by|> Task .* FAILED|e: file" /tmp/build.log | tail -40
            echo "===== 全部 Dart 编译错误（不截断）====="
            grep -nE "\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log | sed 's/^/| /' | head -80
            echo "===== 错误上下文（含 3 行前后）====="
            grep -nE -B3 -A3 "\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log | grep -vE "^\s*$" | head -160
            echo "===== 失败任务上下文 ====="
            LN=$(grep -n "FAILURE:" /tmp/build.log | head -1 | cut -d: -f1)
            if [ -n "${LN:-}" ]; then
              START=$((LN-100)); [ "$START" -lt 1 ] && START=1
              sed -n "${START},$((LN+40))p" /tmp/build.log | grep -vE "^\s*$" | tail -140
            fi
            echo "===== 最后 30 行 ====="
            tail -30 /tmp/build.log
            exit 1
          fi
          tail -20 /tmp/build.log
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: /tmp/build.log
          retention-days: 7

      # ---------- 7.5) 强制 v1+v2+v3 签名（AGP 9 默认不产 v1，老机器装不了） ----------
      - name: Force v1+v2+v3 signature
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for APK in build/app/outputs/flutter-apk/*.apk; do
            echo "re-signing $(basename "$APK")"
            "$BT/apksigner" sign \
              --ks /tmp/catbox.keystore --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              "$APK"
          done

      # ---------- 8) 校验：签名 / zipalign / 16KB ----------
      - name: Verify APKs
        run: |
          set -uo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for APK in build/app/outputs/flutter-apk/*.apk; do
            echo "===== $APK ($(stat -c%s "$APK") bytes) ====="
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -E "^package|sdkVersion|targetSdkVersion|application-label:" || true
            "$BT/apksigner" verify --print-certs --verbose "$APK" 2>&1 | grep -E "Verifies|verified|number of signers" | head -4
            # v1(JAR) 签名必须存在：Android 5.x/6.x 只认它
            if unzip -l "$APK" | grep -qE "META-INF/.*\.(SF|RSA)"; then
              echo "v1 signature: PRESENT"
            else
              echo "::error::v1(JAR) 签名缺失 —— Android 5.x/6.x 将无法安装"
              exit 1
            fi
            # ⚠️ libc++_shared.so 必须存在：libnode.so 依赖它，缺了装上就闪退。
            #    （2026-11-12 用户反馈"打开即闪退"的根因，务必别删掉这个断言。）
            #    按 APK 里**实际出现的 ABI 目录**逐个校验（arm64 单包时只校验 arm64-v8a）。
            APK_ABIS=$(unzip -l "$APK" | awk '/lib\/[a-z0-9_-]+\/.*\.so$/ {split($4,a,"/"); print a[2]}' | sort -u)
            echo "APK 内 ABI: $(echo $APK_ABIS | tr '\n' ' ')"
            for ABI in $APK_ABIS; do
              if unzip -l "$APK" | grep -q "lib/$ABI/libc++_shared.so"; then
                echo "libc++_shared.so ($ABI): PRESENT"
              else
                echo "::error::APK 缺少 lib/$ABI/libc++_shared.so —— 装上会 UnsatisfiedLinkError 闪退"
                exit 1
              fi
            done
            # libnode.so 也必须在（没有它源站引擎跑不起来）
            if ! unzip -l "$APK" | grep -q "lib/.*/libnode.so"; then
              echo "::error::APK 缺少 libnode.so"
              exit 1
            fi
            "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tail -2
            # 16KB：解出所有 .so 跑 ELF 校验 + 打印 APK 内偏移
            rm -rf /tmp/verify && mkdir -p /tmp/verify
            unzip -qo "$APK" 'lib/*' -d /tmp/verify
            echo "--- .so 清单（APK 内偏移 / 大小）---"
            unzip -v "$APK" | grep -E "\.so$" || true
            # ⚠️ **硬失败**（2026-11-12 起）：Android 15+ 是 16KB 页设备，
            #    Android 16 更是全量 16KB；任何没对齐的 .so 一旦被 dlopen 就会失败。
            #    之前这里是 warning → 带着 librtmp-jni.so（p_align=4096）发了几个版本。
            if ! python3 scripts/check_elf_16k.py $(find /tmp/verify/lib -name '*.so' | sort); then
              echo "::error::$APK 存在非 16KB 对齐的 .so —— 16KB 页设备（Android 15/16）上会加载失败"
              exit 1
            fi
            echo "16KB 对齐检查：全部通过 ✅"
          done

      # ---------- 9) 交付物 ----------
      - name: Package artifacts
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          for APK in build/app/outputs/flutter-apk/*.apk; do
            ABI=$(basename "$APK" .apk | sed 's/^app-//; s/-release$//')
            cp "$APK" "out/catbox-$ABI.apk"
          done
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: catbox-android-apk
          path: out/*.apk
          retention-days: 14
